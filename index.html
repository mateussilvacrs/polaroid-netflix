<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="index.js" defer></script>
    <link rel="stylesheet" href="index.css" />
    <title>Paulo Presentes - Início</title>
  </head>
  <body>
    <div class="bg-image"></div>
    <div class="overlay-bg"></div>
    <header class="topbar-index">
      <div class="logo">NETFLIX</div>
    </header>
    <section class="container">
      <div class="txt-nome">
        <h2 class="form-title">Personalize seu Filme</h2>

        <div class="field-group">
          <input
            maxlength="17"
            id="primary-name"
            onblur="formatarTodasPalavras(this)"
            type="text"
            placeholder="Primeiro Nome (Ex: João)"
          />
        </div>

        <div class="field-group">
          <input
            maxlength="17"
            id="second-name"
            onblur="formatarTodasPalavras(this)"
            type="text"
            placeholder="Segundo Nome (Ex: Maria)"
          />
        </div>

        <div class="field-group">
          <textarea
            maxlength="400"
            id="description"
            oninput="atualizarContador()"
            placeholder="Escreva a sinopse da história de vocês..."
          ></textarea>
          <div class="contador-wrapper">
            <span id="contador">0</span>/400
            <div class="barra-progresso">
              <div id="barraPreenchida" class="barra-preenchida"></div>
            </div>
          </div>
        </div>

        <div class="field-group">
          <input
            id="span-ano"
            type="number"
            inputmode="numeric"
            placeholder="Ano de lançamento (Ex: 2022)"
            oninput="this.value = this.value.replace(/\D/g, '').slice(0, 4)"
          />
        </div>

        <button onclick="nomecasal()">Assistir Agora</button>
      </div>
    </section>
    
  </body>
    <footer>
    <p>&copy; Desenvolvido por <a href="https://github.com/mateussilvacrs" target="_blank">Mateus Silva</a>. Todos os direitos reservados.</p>
  </footer>
</html>
